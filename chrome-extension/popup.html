<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Conector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="rc" aria-label="Radar Conector">
    <header class="rc-head">
      <span class="rc-sweep" aria-hidden="true"></span>
      <div class="rc-brand">
        <strong>Radar Conector</strong>
        <span id="linkState" class="rc-link-state">Verificando…</span>
      </div>
      <a href="#" id="openPanel" class="rc-icon-link" title="Abrir o painel">Painel ↗</a>
    </header>

    <!-- Vínculo: só aparece quando a extensão ainda não conhece a conta -->
    <section id="pairBox" class="rc-pair" hidden>
      <p class="rc-pair-title">Entre no painel para vincular</p>
      <p class="rc-muted">Com o painel aberto e logado neste navegador, a extensão se vincula sozinha.</p>
      <div class="rc-row-actions">
        <a href="#" id="openLogin" class="rc-btn rc-btn-main">Abrir o painel</a>
        <button type="button" id="retryPair" class="rc-btn">Já entrei</button>
      </div>
      <details class="rc-code">
        <summary>Tenho um código do painel</summary>
        <div class="rc-code-row">
          <input id="pairCode" maxlength="12" autocomplete="off" placeholder="K7MP4QZ2" aria-label="Código do painel">
          <button type="button" id="btnPair" class="rc-btn">Vincular</button>
        </div>
      </details>
    </section>

    <!-- Faixa contextual: aparece quando a aba atual é a página de uma loja -->
    <section id="here" class="rc-here" hidden aria-live="polite">
      <div>
        <p id="hereTitle" class="rc-here-title"></p>
        <p id="hereHint" class="rc-muted"></p>
      </div>
      <button type="button" id="hereConnect" class="rc-btn rc-btn-main">Conectar agora</button>
    </section>

    <section id="stores" class="rc-stores" hidden aria-label="Suas lojas"></section>

    <div id="manualFields" class="rc-manual" hidden></div>

    <div id="toast" class="rc-toast" role="status" aria-live="polite" hidden></div>

    <footer class="rc-foot">
      <span>Suas senhas ficam só na loja.</span>
      <select id="selectDashboardUrl" aria-label="Servidor do painel">
        <option value="https://painel-de-ofertas.vercel.app">Produção</option>
        <option value="http://localhost:3000">Local</option>
      </select>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
