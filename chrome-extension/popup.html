<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Conector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <article class="cc-popup" aria-label="Extensão Radar Conector">
    <!-- Cabeçalho Radar Conector -->
    <header class="cc-popup-header">
      <div class="cc-brand">
        <span class="cc-radar" aria-hidden="true"></span>
        <div>
          <strong>Radar Conector</strong>
          <small>Suas lojas, mais perto.</small>
        </div>
      </div>
      <button type="button" class="cc-button cc-quiet" id="btnHelp" aria-label="Ajuda de instalação" title="Tutorial de instalação">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>
    </header>

    <!-- Conteúdo Principal -->
    <div class="cc-popup-content">
      <!-- Status do Painel Vinculado -->
      <div class="cc-paired">
        <span class="cc-dot" id="panelDot"></span>
        <span id="pairedText">Painel vinculado</span>
        <button type="button" class="cc-button cc-quiet" id="btnManagePanel">
          Gerenciar
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </button>
      </div>

      <!-- Seletor de 4 Lojas -->
      <div class="cc-shop-picker" role="radiogroup" aria-label="Escolher loja">
        <button type="button" role="radio" data-store="mercadolivre" aria-checked="true" aria-pressed="true">
          <span class="cc-mark">
            <img src="brands/mercadolivre-original.png" alt="Mercado Livre">
          </span>
          Mercado Livre
        </button>
        <button type="button" role="radio" data-store="shopee" aria-checked="false" aria-pressed="false">
          <span class="cc-mark">
            <img src="brands/shopee-original.png" alt="Shopee">
          </span>
          Shopee
        </button>
        <button type="button" role="radio" data-store="amazon" aria-checked="false" aria-pressed="false">
          <span class="cc-mark">
            <img src="brands/amazon-original.png" alt="Amazon">
          </span>
          Amazon
        </button>
        <button type="button" role="radio" data-store="netshoes" aria-checked="false" aria-pressed="false">
          <span class="cc-mark">
            <img src="brands/netshoes-original.png" alt="Netshoes">
          </span>
          Netshoes
        </button>
      </div>

      <!-- Seção de Ação Contextual da Loja Selecionada -->
      <section class="cc-connect-box" aria-live="polite">
        <div class="cc-connect-heading">
          <h3 id="storeTitle">Mercado Livre</h3>
          <span class="cc-pill" id="storeMethod">Pelo navegador</span>
        </div>
        <p id="storeCopy">Entre na sua conta de afiliado neste navegador. Depois, autorize a vinculação ao Radar.</p>
        <button type="button" class="cc-button cc-primary" id="btnStoreAction">
          <svg id="btnStoreIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span id="btnStoreLabel">Conectar conta</span>
        </button>
      </section>

      <!-- Aviso de Segurança Oficial -->
      <p class="cc-secure">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
        <span>Sua senha é informada somente na loja.</span>
      </p>

      <!-- Feedback / Mensagem -->
      <div class="cc-toast" id="popupToast" role="status" aria-live="polite"></div>

      <!-- Opção de Ambiente / Servidor (Discreto, no rodapé interno) -->
      <div class="cc-server-opt" style="margin-top: auto; padding-top: 14px;">
        <span>Servidor do painel:</span>
        <select id="selectDashboardUrl" aria-label="Endereço do painel">
          <option value="https://painel-de-ofertas.vercel.app">Produção (Vercel)</option>
          <option value="http://localhost:3000">Desenvolvimento (Localhost)</option>
        </select>
      </div>
    </div>

    <!-- Rodapé -->
    <footer class="cc-popup-foot">
      <span>Radar de Ofertas</span>
      <span>Conector v2.1</span>
    </footer>
  </article>

  <script src="popup.js"></script>
</body>
</html>
