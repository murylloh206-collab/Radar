<svg viewBox="0 0 560 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .sparkle, .sparkle-dot { animation: glow 3s ease-in-out infinite; }
    .sparkle { transform-box: fill-box; transform-origin: center; animation-name: twinkle; }
    .sparkle-delayed { animation-delay: -1.5s; }
    .sparkle-dot { animation-duration: 4.2s; }
    .sparkle-dot:nth-of-type(2) { animation-delay: -1.4s; }
    .sparkle-dot:nth-of-type(3) { animation-delay: -2.8s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(.76); opacity: .62; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes glow {
      0%, 100% { opacity: .42; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      .sparkle { animation-name: glow; }
      .sparkle, .sparkle-dot { animation-duration: 5s; }
    }
  </style>
